openapi: 3.0.3
info:
  title: Smart Budget beta authorization
  version: 1.0.0
  description: Firebase Spark authentication with a Cloudflare Worker. No financial data API.
paths:
  /authorizeSession:
    post:
      summary: Verify Firebase identity, consume App Check, and issue a bound offline lease
      security:
        - firebaseIdentity: []
          firebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installationId]
              properties:
                installationId:
                  type: string
                  pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        '200':
          description: Stage 2 Ed25519 JWS; UID/project/installation/policy-bound; at most 24 hours
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [lease]
                properties:
                  lease: {type: string, maxLength: 4096}
        '400': {description: Invalid body or installation ID}
        '401': {description: Missing/invalid/expired/revoked identity or disabled account}
        '403': {description: Unapproved member or invalid/replayed App Check; code app-check-failed identifies attestation failure}
        '429': {description: Per-UID or global rate limit reached}
        '503': {description: Backend configuration or upstream service unavailable; never grants access}
  /leaseVerificationKeys:
    get:
      summary: Retrieve public lease verification keys
      responses:
        '200':
          description: Public Ed25519 JWKS with overlapping rotation keys; cached for five minutes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [keys]
                properties:
                  keys:
                    type: array
                    minItems: 1
                    maxItems: 5
                    items:
                      type: object
                      additionalProperties: false
                      required: [kty, crv, x, kid, alg, use]
                      properties:
                        kty: {type: string, enum: [OKP]}
                        crv: {type: string, enum: [Ed25519]}
                        x: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
                        kid: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
                        alg: {type: string, enum: [EdDSA]}
                        use: {type: string, enum: [sig]}
        '503': {description: Missing or invalid public-key configuration}
components:
  securitySchemes:
    firebaseIdentity:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
    firebaseAppCheck:
      type: apiKey
      in: header
      name: X-Firebase-AppCheck
